name: Deploy website (GitHub Pages)

# Publishes docs/ to GitHub Pages. One static file, no build step — just upload
# the folder and deploy. Enable it once under Settings → Pages → Source:
# "GitHub Actions"; after that every push to main that touches docs/ redeploys.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, mint the OIDC
# token the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
